# Windows validation: compile the complete workspace and run every registered
# headless/smoke test. GPU presentation remains a separate hardware-lane concern.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-msvc-smoke:
    name: Windows MSVC (smoke targets)
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # humbletim/install-vulkan-sdk unpacks the Windows .exe with 7z; recent LunarG layouts can omit headers
      # under VULKAN_SDK (CMake then finds no vulkan.h). jakoch runs the SDK installer and sets VULKAN_SDK correctly.
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true

      # Hosted runners have no GPU driver, so vulkan-1.dll never exists in System32. Anything
      # linking Vulkan::Vulkan (ri_tool, preview apps) hits STATUS_DLL_NOT_FOUND (0xc0000135) at
      # process start unless the loader DLL is on PATH. Older cached SDK folders may predate
      # install_runtime, so fall back to downloading the runtime components directly.
      - name: Ensure Vulkan runtime DLL on PATH
        shell: pwsh
        run: |
          $candidates = @('C:\Windows\System32\vulkan-1.dll')
          if ($env:VULKAN_SDK) {
            $candidates = @(
              (Join-Path $env:VULKAN_SDK 'runtime\x64\vulkan-1.dll'),
              (Join-Path $env:VULKAN_SDK 'Bin\vulkan-1.dll')
            ) + $candidates
          }
          $found = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $found) {
            $zip = Join-Path $env:RUNNER_TEMP 'vulkan-runtime.zip'
            $dir = Join-Path $env:RUNNER_TEMP 'vulkan-runtime'
            Invoke-WebRequest -Uri 'https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-runtime-components.zip' -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
            $found = Get-ChildItem -Path $dir -Recurse -Filter 'vulkan-1.dll' |
              Where-Object { $_.FullName -match 'x64' } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $found) { throw 'vulkan-1.dll not found: SDK runtime missing and runtime download failed' }
          Write-Host "Vulkan runtime loader: $found"
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $found)

      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake (preset dev-msvc)
        run: cmake --preset dev-msvc -DRAWIRON_BUILD_TESTS=ON -DRAWIRON_BUILD_TOOLS=ON

      - name: Build complete workspace (CI)
        shell: pwsh
        run: |
          cmake --build build/dev-msvc --config RelWithDebInfo --parallel

      - name: UiMenu headless smoke
        shell: pwsh
        run: |
          $exe = Join-Path "${{ github.workspace }}" "build/dev-msvc/Apps/RawIron.UiMenu/RelWithDebInfo/RawIron.UiMenu.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Missing $exe" }
          & $exe --workspace="${{ github.workspace }}" --headless
          if ($LASTEXITCODE -ne 0) { throw "UiMenu --headless exited $LASTEXITCODE" }

      - name: Complete registered test suite
        shell: pwsh
        run: |
          ctest --test-dir build/dev-msvc -C RelWithDebInfo --output-on-failure --timeout 180

      - name: Configure ENet network lane
        run: cmake --preset dev-msvc-network

      - name: Build and verify real ENet backend
        shell: pwsh
        run: |
          cmake --build build/dev-msvc-network --config RelWithDebInfo --parallel `
            --target RuntimeNetcodeSmoke RawIron.DedicatedServer RawIron.BotClient
          ctest --test-dir build/dev-msvc-network -C RelWithDebInfo --output-on-failure --timeout 180 `
            -R "RawIron\.(Runtime\.NetcodeSmoke|DedicatedServer\.Smoke|BotClient\.Smoke)"

      - name: Configure memory-safety lane
        run: cmake --preset dev-msvc-sanitized

      - name: Build memory-safety targets
        shell: pwsh
        run: |
          cmake --build build/dev-msvc-sanitized --config RelWithDebInfo --parallel `
            --target CommandLineSmoke CoreUtilitiesSafetySmoke FixedStepAccumulatorSmoke ImageComparisonSmoke FrameArenaSmoke `
              SceneSnapshotStorageSmoke PluginProjectDataSmoke PluginRuntimeSmoke NativePluginHostSmoke PackageResolverSmoke PackageMountRegistrySmoke `
              SnapshotReplicationSmoke MovementControllerDurationSmoke NavMeshPathfindingSmoke

      - name: Stage AddressSanitizer runtime
        shell: pwsh
        run: |
          if (-not $env:VCToolsInstallDir) { throw 'VCToolsInstallDir is unavailable' }
          $runtimeDir = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64'
          $runtimeDll = Join-Path $runtimeDir 'clang_rt.asan_dynamic-x86_64.dll'
          if (-not (Test-Path -LiteralPath $runtimeDll)) { throw "Missing MSVC ASan runtime: $runtimeDll" }
          Add-Content -Path $env:GITHUB_PATH -Value $runtimeDir

      - name: Run memory-safety tests
        shell: pwsh
        run: |
          ctest --test-dir build/dev-msvc-sanitized -C RelWithDebInfo --output-on-failure --timeout 180 `
            -R "RawIron\.(Core\.(CommandLineSmoke|UtilitiesSafetySmoke|FixedStepAccumulatorSmoke|ImageComparisonSmoke|FrameArenaSmoke|SceneSnapshotStorageSmoke)|Content\.(PluginProjectDataSmoke|PluginRuntimeSmoke|NativePluginHostSmoke|PackageResolverSmoke|PackageMountRegistrySmoke)|Runtime\.SnapshotReplicationSmoke|Trace\.MovementControllerDurationSmoke|World\.NavMeshPathfindingSmoke)"
