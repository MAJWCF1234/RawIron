// Balanced stack for Particle Showcase — strong look without blowing out the Hybrid HDR → NativeComposite path.
// (Heavy FakeHDR + pixel-shift Chromatic Aberration + high blendWeight previously clipped the frame to white.)
// Edit blendWeight 0.1–0.25 to taste; use --no-shader-cfg on the exe to bypass this file entirely.
{
  "version": 1,
  "blendWeight": 0.14,
  "replace": false,
  "effects": [
    {
      "id": "preset",
      "preset": "combat_focus",
      "blend": 0.12
    },
    {
      "id": "cas",
      "blend": 1.0,
      "params": {
        "sharpen": 0.32,
        "contrast": 0.22
      }
    },
    {
      "id": "bloom",
      "blend": 1.0,
      "params": {
        "intensity": 0.028,
        "threshold": 1.18
      }
    },
    {
      "id": "vibrance",
      "blend": 1.0,
      "params": {
        "vibrance": 0.22
      }
    },
    {
      "id": "vignette",
      "blend": 1.0,
      "params": {
        "strength": 0.24,
        "blur": 0.002
      }
    },
    {
      "id": "grade",
      "blend": 1.0,
      "params": {
        "tint_strength": 0.045,
        "curve": 0.11,
        "dither": 0.36
      }
    },
    {
      "id": "film",
      "blend": 0.75,
      "params": {
        "grain": 0.055,
        "noise": 0.0035,
        "scanlines": 0.0025
      }
    },
    {
      "id": "deband",
      "blend": 1.0,
      "params": {
        "strength": 0.048
      }
    }
  ],
  "post": {
    "output_dither_strength": 0.38
  }
}
